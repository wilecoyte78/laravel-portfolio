services:
    app:
        build:
            context: ./docker
            dockerfile: Dockerfile
            args:
                HOST_UID: "${HOST_UID:-1000}"
                HOST_GID: "${HOST_GID:-1000}"

        container_name: "${CONTAINER_NAME:-portfolio}-app"
        restart: unless-stopped

        working_dir: /var/www/html

        ports:
            - "${APP_PORT:-8080}:80"

        volumes:
            - ./:/var/www/html
            - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
            - ./docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/99-error-reporting.ini:ro

        environment:
            APP_ENV: "${APP_ENV:-local}"
            APP_DEBUG: "${APP_DEBUG:-true}"

            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE:-portfolio}"
            DB_USERNAME: "${DB_USERNAME:-portfolio}"
            DB_PASSWORD: "${DB_PASSWORD:-portfolio}"

        networks:
            - portfolio

        depends_on:
            pgsql:
                condition: service_healthy

        extra_hosts:
            - "host.docker.internal:host-gateway"
    cli:
        build:
            context: ./docker
            dockerfile: Dockerfile
            args:
                HOST_UID: "${HOST_UID:-1000}"
                HOST_GID: "${HOST_GID:-1000}"

        container_name: "${CONTAINER_NAME:-portfolio}-cli"

        working_dir: /var/www/html

        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

        volumes:
            - ./:/var/www/html
            - portfolio-node-modules:/var/www/html/node_modules
            - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
            - ./docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/99-error-reporting.ini:ro

        environment:
            APP_ENV: "${APP_ENV:-local}"
            APP_DEBUG: "${APP_DEBUG:-true}"

            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE:-portfolio}"
            DB_USERNAME: "${DB_USERNAME:-portfolio}"
            DB_PASSWORD: "${DB_PASSWORD:-portfolio}"

            HOME: /tmp
            NPM_CONFIG_CACHE: /tmp/.npm

        networks:
            - portfolio

        depends_on:
            pgsql:
                condition: service_healthy
    pgsql:
        image: postgres:15

        container_name: "${CONTAINER_NAME:-portfolio}-pgsql"

        restart: unless-stopped

        ports:
            - "${DB_PORT:-5432}:5432"

        environment:
            POSTGRES_DB: "${DB_DATABASE:-portfolio}"
            POSTGRES_USER: "${DB_USERNAME:-portfolio}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-portfolio}"

        volumes:
            - portfolio-pgsql:/var/lib/postgresql/data

        networks:
            - portfolio

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-portfolio} -d ${DB_DATABASE:-portfolio}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    portfolio:
        driver: bridge

volumes:
    portfolio-pgsql:
        driver: local
    portfolio-node-modules:
        driver: local
