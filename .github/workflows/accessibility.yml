name: Accessibility checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: axe-core and palette contrast
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/axe-check/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install accessibility tool dependencies
        working-directory: tools/axe-check
        run: npm ci

      - name: Run axe-core accessibility checks
        working-directory: tools/axe-check
        run: node run.mjs "${{ github.workspace }}"

      - name: Run palette contrast checks
        run: python3 tools/axe-check/contrast.py